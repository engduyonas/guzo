name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Start Mongo (replica set) and Redis
        run: docker compose up -d --wait mongo redis
      - run: uv run pytest

  ts-client:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the TypeScript types and check they compile
        run: scripts/generate_ts_client.sh
      - uses: actions/upload-artifact@v4
        with:
          name: guzo-ts-client
          path: clients/ts
